<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>netease-music client harness</title>
  <style>
    /* ------------------------------------------------------------------
     * DSH 主题 token 的离线快照（light 默认，dark 走 prefers-color-scheme）
     * 取值来自 Harness 主题定义：neutral-bluish 色阶 + 语义别名
     * ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --dsw-alias-bg-base: #ffffff;
      --dsw-alias-bg-layer-1: #ffffff;
      --dsw-alias-bg-layer-2: #ffffff;
      --dsw-alias-bg-layer-3: #f9fafb;
      --dsw-alias-bg-overlay: #ffffff;
      --dsw-alias-bg-skeleton: rgba(0, 0, 0, .06);
      --dsw-alias-bg-mask-drop: #272730b3;
      --dsw-alias-label-primary: #0f1115;
      --dsw-alias-label-secondary: #61666b;
      --dsw-alias-label-tertiary: #81858c;
      --dsw-alias-label-caption: #81858c;
      --dsw-alias-label-primary-inverted: #353638;
      --dsw-alias-border-l1: rgba(0, 0, 0, .04);
      --dsw-alias-border-l2: rgba(0, 0, 0, .1);
      --dsw-alias-border-l3: rgba(0, 0, 0, .16);
      --dsw-alias-border-l4: rgba(0, 0, 0, .2);
      --dsw-alias-brand-primary: #4d6bfe;
      --dsw-alias-state-success-primary: #22c55e;
      --dsw-alias-state-warn-primary: #f59e0b;
      --dsw-alias-state-error-primary: #ec1313;
      --dsw-alias-fill-tertiary: rgba(0, 0, 0, .08);
      --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .05);
      --dsw-alias-interactive-bg-hover-solid: #f1f3f5;
      --dsw-alias-button-primary-fill: #4d6bfe;
      --dsw-alias-button-primary-hover: #353638;
      --dsw-specific-sidebar-fill: #f9fafb;
      --dsw-specific-input-major: #ffffff;
      --dsh-frame-top-clearance: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --dsw-alias-bg-base: #151517;
        --dsw-alias-bg-layer-1: #232324;
        --dsw-alias-bg-layer-2: #2c2c2e;
        --dsw-alias-bg-layer-3: #353638;
        --dsw-alias-bg-overlay: #2c2c2e;
        --dsw-alias-bg-skeleton: rgba(255, 255, 255, .08);
        --dsw-alias-bg-mask-drop: #272730b3;
        --dsw-alias-label-primary: #f9fafb;
        --dsw-alias-label-secondary: #cfd3d6;
        --dsw-alias-label-tertiary: #adb2b8;
        --dsw-alias-label-caption: #81858c;
        --dsw-alias-label-primary-inverted: #2c2c2e;
        --dsw-alias-border-l1: rgba(255, 255, 255, .06);
        --dsw-alias-border-l2: rgba(255, 255, 255, .12);
        --dsw-alias-border-l3: rgba(255, 255, 255, .16);
        --dsw-alias-border-l4: rgba(255, 255, 255, .2);
        --dsw-alias-brand-primary: #4d6bfe;
        --dsw-alias-state-success-primary: #22c55e;
        --dsw-alias-state-warn-primary: #f59e0b;
        --dsw-alias-state-error-primary: #f25a5a;
        --dsw-alias-fill-tertiary: rgba(255, 255, 255, .08);
        --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .08);
        --dsw-alias-interactive-bg-hover-solid: #353638;
        --dsw-alias-button-primary-fill: #4d6bfe;
        --dsw-alias-button-primary-hover: #ebeef2;
        --dsw-specific-sidebar-fill: #1b1b1c;
        --dsw-specific-input-major: #232324;
      }
    }

    html, body, #app { height: 100%; margin: 0; }
    body {
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 模拟 DSH：左侧栏（含 footer action 槽）+ 右下面板 + 面板内输入框。
       v3 播放条不再注册 shell.bottom / shell.overlay，改为面板内 dock + 侧栏迷你播放器。 */
    #app { display: flex; height: 100%; overflow: hidden; }
    #body { display: contents; }
    #rail {
      width: 56px; flex: none; box-sizing: border-box;
      background: var(--dsw-specific-sidebar-fill);
      border-right: 1px solid var(--dsw-alias-border-l1);
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 0 10px; gap: 8px;
      transition: width 160ms ease;
    }
    #rail.is-wide { width: 280px; padding: 16px 12px 10px; align-items: stretch; }
    #rail.is-wide #rail-brand, #rail.is-wide #sidebar-icon { align-self: flex-start; }
    #rail.is-wide #sidebar-footer { align-items: stretch; }
    #rail-brand {
      width: 26px; height: 26px; border-radius: 8px; margin-bottom: 10px;
      background: color-mix(in srgb, var(--dsw-alias-label-primary) 10%, transparent);
    }
    #sidebar-icon { display: grid; place-items: center; }
    #rail-spacer { flex: 1 1 auto; }
    /* sidebar.footer.action 列表槽：紧挨 Settings 上方 */
    #sidebar-footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden; }
    #rail.is-wide #sidebar-footer { align-items: stretch; }
    #rail-settings {
      width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
      color: var(--dsw-alias-label-secondary); font-size: 15px;
      border: 1px solid var(--dsw-alias-border-l1);
    }
    #main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
    #root { flex: 1 1 auto; min-height: 0; height: auto; }
    /* 假对话页：模拟当前激活面板不是网易云时的 Harness 主区 */
    #fake-conversation { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; padding: 56px 28px 20px; gap: 16px; overflow: hidden; }
    html[data-active-panel="conversation"] #root { display: none; }
    html[data-active-panel="conversation"] #fake-conversation { display: flex; }
    #fake-conversation .conv-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--dsw-alias-label-primary); }
    #fake-conversation .conv-sub { font-size: 13px; color: var(--dsw-alias-label-tertiary); }
    #fake-conversation .conv-msg {
      max-width: 640px; padding: 12px 16px; border-radius: 14px; font-size: 13px; line-height: 1.6;
      background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-secondary);
      border: 1px solid var(--dsw-alias-border-l1);
    }
    #fake-conversation .conv-msg.user { align-self: flex-end; background: var(--dsw-specific-input-major); color: var(--dsw-alias-label-primary); }
    /* 假 DSH 输入框：面板内 dock 应在其上方，不遮挡 */
    #composer {
      flex: none; height: 64px; box-sizing: border-box;
      display: flex; align-items: center; gap: 10px; padding: 0 22px;
      background: var(--dsw-alias-bg-layer-1);
      border-top: 1px solid var(--dsw-alias-border-l2);
    }
    #composer .composer-input {
      flex: 1 1 auto; height: 38px; min-width: 0; box-sizing: border-box;
      display: flex; align-items: center; padding: 0 14px;
      border: 1px solid var(--dsw-alias-border-l2); border-radius: 12px;
      background: var(--dsw-specific-input-major);
      color: var(--dsw-alias-label-tertiary); font-size: 13px;
    }
    #composer .composer-send {
      flex: none; width: 32px; height: 32px; border-radius: 999px;
      background: var(--dsw-alias-label-primary); color: var(--dsw-alias-bg-base);
      display: grid; place-items: center; font-size: 15px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="rail">
      <div id="rail-brand"></div>
      <div id="sidebar-icon"></div>
      <div id="rail-spacer"></div>
      <div id="sidebar-footer"></div>
      <div id="rail-settings" aria-hidden="true">⚙</div>
    </div>
    <div id="main">
      <div id="root"></div>
      <div id="fake-conversation" aria-hidden="true">
        <div class="conv-title">DeepSeek 对话</div>
        <div class="conv-sub">harness 模拟的其它面板（非网易云），用于验证侧栏迷你播放器</div>
        <div class="conv-msg user">在写一份插件验收报告，顺便放点音乐。</div>
        <div class="conv-msg">好的，音乐面板已在侧栏打开；当前面板切走后，迷你播放器会出现在左侧栏底部。</div>
      </div>
      <div id="composer" aria-hidden="true">
        <div class="composer-input">给 DeepSeek 发消息…（harness 假输入框，验证面板内 dock 不遮挡）</div>
        <div class="composer-send">↑</div>
      </div>
    </div>
  </div>

  <!-- React 18 UMD（离线保存于 assets/，与 garmin-panel-selftest 同一份） -->
  <script src="/react.js"></script>
  <script src="/react-dom.js"></script>
  <script>
    /* ------------------------------------------------------------------
     * 验收脚手架：捕获三个 slot 注册 + 假 locale/layout/effect
     * 只认 CONTRACT.md 第 9 节的 data-nm 钩子，不依赖 class 名
     * ------------------------------------------------------------------ */
    window.__slots = { main: null, 'sidebar.panellist': null, 'sidebar.footer.action': null, 'shell.bottom': null, 'shell.overlay': null };
    window.__slotSpecs = {};
    window.__disposers = [];
    window.__selectedPanels = [];
    window.__localeRegistered = {};
    window.__lang = 'zh';
    window.__mountError = null;
    window.__slotRender = null;
    document.documentElement.dataset.activePanel = 'netease-music';
    // v3：模拟 Harness 当前激活面板（conversation / netease-music），供 usePanelInfo 注入
    window.__activePanelId = 'netease-music';
    window.__panelInfo = { activePanelId: 'netease-music' };
    window.__miniWide = false;
    window.__panelStore = {
      id: 'netease-music',
      listeners: new Set(),
      get: function () { return this.id; },
      set: function (id) {
        this.id = id;
        window.__activePanelId = id;
        window.__panelInfo = { activePanelId: id };
        try { document.documentElement.dataset.activePanel = id } catch (_) {}
        this.listeners.forEach(function (fn) { try { fn() } catch (_) {} });
      },
      subscribe: function (fn) { this.listeners.add(fn); var self = this; return function () { self.listeners.delete(fn) }; }
    };

    window.__logError = function (err) {
      const text = String((err && (err.stack || err.message)) || err);
      (window.__errors = window.__errors || []).push(text);
      console.error(text);
    };

    window.__ModuleLoader__ = {
      load: function (entry) {
        window.__pluginEntry = entry;
        try {
          window.__plugin = entry.factory(function require(name) {
            if (name === 'react') return window.React;
            if (name === 'react-dom') return window.ReactDOM;
            throw new Error('unexpected require: ' + name);
          });
        } catch (err) {
          window.__mountError = 'factory 抛错: ' + ((err && (err.stack || err.message)) || err);
          window.__logError(err);
        }
      }
    };

    function createCtx() {
      const localeStore = window.__localeRegistered; // ns -> { zh, en }
      const listeners = [];
      const lang = () => window.__lang;
      function lookup(ns, key) {
        const dict = localeStore[ns] || {};
        const exact = (dict[lang()] || {})[key];
        if (exact != null) return exact;
        const zh = (dict.zh || {})[key];
        if (zh != null) return zh;
        for (const k of Object.keys(dict)) {
          const v = (dict[k] || {})[key];
          if (v != null) return v;
        }
        return undefined;
      }
      function makeT(ns) {
        return function t(key, vars) {
          let s = lookup(ns, key);
          if (s == null) return undefined;
          if (typeof s === 'string' && vars && typeof vars === 'object') {
            s = s.replace(/\{(\w+)\}/g, function (m, k) {
              return vars[k] == null ? m : String(vars[k]);
            });
          }
          return s;
        };
      }
      const locale = {
        get current() { return lang(); },
        get locale() { return lang(); },
        get lang() { return lang(); },
        register: function (ns, a, b) {
          if (a && typeof a === 'object') {
            // register(ns, { zh, en })
            localeStore[ns] = localeStore[ns] || {};
            for (const code of Object.keys(a)) {
              localeStore[ns][code] = Object.assign({}, localeStore[ns][code], a[code]);
            }
          } else if (typeof a === 'string' && b && typeof b === 'object') {
            // register(ns, 'zh', {...})
            localeStore[ns] = localeStore[ns] || {};
            localeStore[ns][a] = Object.assign({}, localeStore[ns][a], b);
          }
          listeners.forEach(function (fn) { try { fn() } catch (_) {} });
          return function () {};
        },
        bind: function (ns) { return makeT(ns || 'netease-music'); },
        t: function (a, b, c) {
          if (typeof b === 'string') return makeT(a)(b, c);
          return makeT('netease-music')(a, b);
        },
        subscribe: function (fn) { listeners.push(fn); return function () {}; },
        setLocale: function (l) { window.__lang = l; listeners.forEach(function (fn) { try { fn() } catch (_) {} }); }
      };

      const slots = {
        inject: function (name, factory) { return factory(); },
        register: function (spec, comp) {
          if (!spec || !spec.name) throw new Error('slots.register 需要 { name }');
          window.__slots[spec.name] = comp;
          window.__slotSpecs[spec.name] = spec;
          return function () { window.__slots[spec.name] = null; };
        }
      };

      const layout = {
        get panel() { return window.__panelStore.get(); },
        selectPanel: function (id) {
          window.__selectedPanels.push(id);
          if (id) window.__panelStore.set(id);
          return true;
        },
        openPanel: function (id) { return this.selectPanel(id); },
        focusPanel: function (id) { return this.selectPanel(id); },
        getState: function () { return { panel: window.__panelStore.get() }; }
      };

      const ctx = {
        effect: function (fn) {
          const d = fn();
          if (typeof d === 'function') window.__disposers.push(d);
          return d;
        },
        get: function () { return undefined; },
        slots: slots,
        locale: locale,
        layout: layout,
        logger: { info: function () {}, warn: function () {}, error: function () {} },
        webServer: { register: function () { return function () {}; } },
        remote: { session: { prompt: function () { return Promise.resolve({ ok: true }); } } }
      };
      window.__ctx = ctx;
      return ctx;
    }

    window.__unmount = function () {
      for (const d of window.__disposers.splice(0)) {
        try { if (typeof d === 'function') d(); } catch (_) {}
      }
      for (const key of ['root', 'sidebar', 'mini']) {
        try { if (window['__root_' + key]) window['__root_' + key].unmount(); } catch (_) {}
      }
    };

    /* v3：框架注入给 sidebar.footer.action 的 usePanelInfo（读 window.__panelStore） */
    function harnessUsePanelInfo(selector) {
      const React = window.React
      const id = React.useSyncExternalStore(
        window.__panelStore.subscribe.bind(window.__panelStore),
        function () { return window.__panelStore.get(); }
      )
      const info = { activePanelId: id, panelId: id, activePanel: id, panel: id }
      return typeof selector === 'function' ? selector(info) : info
    }

    window.__renderMini = function () {
      const comp = window.__slots['sidebar.footer.action']
      if (!comp) return false
      if (!window.__root_mini) {
        window.__root_mini = ReactDOM.createRoot(document.getElementById('sidebar-footer'))
      }
      window.__root_mini.render(React.createElement(comp, {
        wide: !!window.__miniWide,
        usePanelInfo: harnessUsePanelInfo,
      }))
      return true
    };

    window.__setActivePanel = function (id) { window.__panelStore.set(id) };
    window.__setMiniWide = function (wide) {
      window.__miniWide = !!wide
      if (window.__renderMini) window.__renderMini()
    };

    // v3：切换假侧栏展开/收起（280px / 56px）；mini 的 wide prop 跟随侧栏宽度
    window.__sidebarWide = false;
    window.__setSidebarWide = function (wide) {
      window.__sidebarWide = !!wide
      const rail = document.getElementById('rail')
      if (rail) {
        rail.classList.toggle('is-wide', !!wide)
        rail.style.width = wide ? '280px' : '56px'
      }
      window.__miniWide = !!wide
      if (window.__renderMini) window.__renderMini()
    };

    window.__mount = function () {
      window.__mountError = null;
      if (!window.__plugin) {
        window.__mountError = 'window.__plugin 未创建（client.js 未加载或 factory 抛错）';
        window.__logError(window.__mountError);
        return false;
      }
      try {
        const plugin = window.__plugin;
        const ctx = createCtx();
        plugin.apply(ctx);
      } catch (err) {
        window.__mountError = 'apply 抛错: ' + ((err && (err.stack || err.message)) || err);
        window.__logError(err);
        return false;
      }
      const main = window.__slots['main'];
      const icon = window.__slots['sidebar.panellist'];
      const mini = window.__slots['sidebar.footer.action'];
      const bottom = window.__slots['shell.bottom'];
      const overlay = window.__slots['shell.overlay'];
      window.__slotRender = { bottom: !!bottom, overlay: !!overlay, footer: !!mini };
      if (!main) {
        window.__mountError = 'main slot 未注册';
        window.__logError(window.__mountError);
        return false;
      }
      try {
        window.__root_root = ReactDOM.createRoot(document.getElementById('root'));
        window.__root_root.render(React.createElement('div', { style: { height: '100%' } }, React.createElement(main, {})));
        if (icon) {
          window.__root_sidebar = ReactDOM.createRoot(document.getElementById('sidebar-icon'));
          window.__root_sidebar.render(React.createElement('div', { style: { width: 34, height: 34, display: 'grid', placeItems: 'center', borderRadius: 10, background: 'color-mix(in srgb, currentColor 9%, transparent)' } }, React.createElement(icon, { size: 20, active: true })));
        }
        if (mini) window.__renderMini();
        // v3 起 client 不再注册 shell.bottom / shell.overlay；若仍注册只记录、不渲染（断言用）
      } catch (err) {
        window.__mountError = 'mount 抛错: ' + ((err && (err.stack || err.message)) || err);
        window.__logError(err);
        return false;
      }
      window.__mounted = true;
      return true;
    };

    window.addEventListener('error', function (e) { window.__logError(e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { window.__logError(e.reason); });
  </script>
  <script src="/client.js"></script>
  <script>
    (function () {
      if (!window.__plugin && !window.__mountError) {
        window.__mountError = 'client.js 没有调用 window.__ModuleLoader__.load';
        console.error(window.__mountError);
      }
      if (window.__plugin) window.__mount();
    })();
  </script>
</body>
</html>
